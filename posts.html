<!DOCTYPE html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>The Quiet Desk</title>
  <meta
    name="description"
    description="A personal corner to dump my thoughts and opinions on tech, privacy,
          Linux, and whatever else I’m into."
  />
  <meta name="author" content="The Quiet Desk009" />
  <link rel="stylesheet" href="/styles/style.css" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>
<body>
  <div id="sidebar"></div>
  <div class="main-container">
    <div class="theme-toggle">
      <img id="themeSwitchButton" src="/images/theme-toggle.png" alt="" />
    </div>
    <div id="box1"><h1>Posts Shelf</h1></div>

    <main>
      <div class="searchbox-wrapper">
        <input type="text" id="searchBox" placeholder="Search Anything..." />
      </div>
      <div id="postsGrid"></div>
    </main>

    <div id="footerPlace"></div>
  </div>
  <!-- Script section -->
  <script src="/js/dark-mode.js" defer></script>
  <script src="/js/posts-index.js" defer></script>
  <script src="/js/sidebar.js" defer></script>
  <script src="/js/searchbox.js" defer></script>
  <script src="/js/footer.js" defer></script>
</body>
